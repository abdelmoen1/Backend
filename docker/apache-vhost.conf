<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Render ينهي TLS عند الوكيل؛ Laravel يقرأ X-Forwarded-Proto عبر trustProxies
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    ServerSignature Off
</VirtualHost>
